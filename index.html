  <!-- Clickjacking defense for static hosts (e.g. GitHub Pages) that can't send
       X-Frame-Options / CSP frame-ancestors headers. The real protection is the
       HTTP headers set by the server (vite.config.ts headers / Django middleware);
       this OWASP "legacy" frame-buster covers hosting where headers aren't possible.
       Note: a <meta> CSP tag can NOT do this — frame-ancestors is ignored in meta. -->
  <style id="antiClickjack">
    body { display: none !important; }
  </style>
  <script type="text/javascript">
    if (self === top) {
      var antiClickjack = document.getElementById("antiClickjack");
      antiClickjack.parentNode.removeChild(antiClickjack);
    } else {
      top.location = self.location;
    }
  </script>
  <script type="text/javascript">
    // GitHub Pages SPA redirect restore.
    // The 404.html encodes the path as a ?/ query string.
    // This script decodes it back into the real URL before React loads.
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
